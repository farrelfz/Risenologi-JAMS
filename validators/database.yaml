name: Database Validator
checks:
  - id: RLS_ENABLED
    description: Every table must have RLS enabled.
    result: FAIL_if_not_found
  - id: UUID_PK
    description: All primary keys must be UUID type.
    result: FAIL_if_not_found
  - id: TIMESTAMPS
    description: Tables must have created_at and updated_at columns.
    result: WARN_if_not_found
  - id: NO_PUBLIC_POLICY
    description: No policy should allow anonymous/public access.
    result: FAIL_if_found
  - id: MIGRATION_REVERSIBLE
    description: Migrations should include a rollback (DOWN) section.
    result: WARN_if_not_found
