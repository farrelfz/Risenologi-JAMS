name: Frontend Validator
checks:
  - id: NO_DIRECT_DB
    description: Components must not import or call Supabase client.
    result: FAIL_if_found
  - id: NO_SERVICE_IMPORT
    description: Components must not directly import Service classes.
    result: FAIL_if_found
  - id: HAS_LOADING_STATE
    description: Async components must render a loading skeleton or spinner.
    result: WARN_if_not_found
  - id: HAS_EMPTY_STATE
    description: List components must render a meaningful empty state.
    result: WARN_if_not_found
  - id: HAS_ERROR_STATE
    description: Components must handle error states gracefully.
    result: WARN_if_not_found
  - id: ARIA_LABELS
    description: Interactive elements must have accessible labels.
    result: WARN_if_not_found
