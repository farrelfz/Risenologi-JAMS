name: Security Validator
checks:
  - id: NO_SERVICE_KEY_IN_CLIENT
    description: SUPABASE_SERVICE_ROLE_KEY must never appear in client-side code.
    result: FAIL_if_found
  - id: AUTH_CHECK_IN_ACTIONS
    description: Every Server Action must call requireRole() before any DB operation.
    result: FAIL_if_not_found
  - id: ZOD_VALIDATION
    description: Every Server Action must validate input with Zod before processing.
    result: FAIL_if_not_found
  - id: RLS_ENABLED
    description: All database tables must have RLS enabled.
    result: FAIL_if_not_found
  - id: NO_RAW_SECRETS_IN_CODE
    description: No secrets or credentials hardcoded in source files.
    result: FAIL_if_found
