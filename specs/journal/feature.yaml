feature: journal
description: Manages journal metadata, ISSN, and lifecycle status.
capability: journal-management
domain: journal
owner: Journal Manager

fields:
  - name: id
    type: uuid
    required: true
    generated: true
  - name: title
    type: string
    required: true
    maxLength: 500
  - name: issn_print
    type: string
    required: false
    pattern: "^[0-9]{4}-[0-9]{3}[0-9X]$"
  - name: issn_online
    type: string
    required: false
    pattern: "^[0-9]{4}-[0-9]{3}[0-9X]$"
  - name: status
    type: enum
    values: [active, inactive, suspended]
    required: true
