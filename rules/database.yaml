name: Database Rules
version: "1.0"

mandatory:
  - rls_enabled_on_all_tables
  - uuid_primary_keys
  - created_at_column
  - updated_at_column

forbidden:
  - public_anonymous_access
  - service_role_in_client
  - raw_passwords_in_db

rls_policies:
  internal_access: "auth.jwt() ->> 'role' IN ('administrator','journal_manager','editor')"
  admin_only: "auth.jwt() ->> 'role' = 'administrator'"

migrations:
  format: sequential_numbered
  naming: "YYYYMMDDHHMMSS_descriptive_name.sql"
  must_include: [up, down]
